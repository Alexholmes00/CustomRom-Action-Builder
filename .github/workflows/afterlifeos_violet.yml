name: Build OS for nx563j

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OS for nx563j
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/.ghcup
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-11-jdk bc bison build-essential curl flex git gnupg gperf \
          libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush repo rsync \
          schedtool squashfs-tools xsltproc zip unzip zlib1g-dev ccache git-lfs neofetch python-is-python3
        
    - name: Set Git config and add repo tool
      run: |
        neofetch
        git config --global user.name "aa"
        git config --global user.email "aa@gmail.com"
        git config --global gc.autodetach true
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Setup ccache
      run: |
        export CCACHE_EXEC=$(which ccache)
        export USE_CCACHE=1
        ccache -M 20G
        ccache -c

    - name: Initialize AfterlifeOS repo
      run: |
        mkdir -p rom && cd rom
        repo init --depth=1 -u https://github.com/Evolution-X/manifest -b cnb --git-lfs --no-clone-bundle
        timeout 300 repo sync -c --no-tags --no-clone-bundle -j4 || true
        
    - name: Clone device tree, vendor, kernel
      run: |
        cd rom
        git clone --depth=1 https://github.com/LineageOS/android_device_nubia_msm8998-common.git device/nubia/msm8998-common || true
        git clone --depth=1 https://github.com/LineageOS/android_device_nubia_nx563j.git device/nubia/nx563j || true
        git clone --depth=1 https://github.com/LineageOS/android_kernel_nubia_msm8998.git kernel/nubia/msm8998 || true
        git clone --depth=1 https://github.com/TheMuppets/proprietary_vendor_nubia_nx563j.git vendor/nubia/nx563j || true
        git clone --depth=1 https://github.com/TheMuppets/proprietary_vendor_nubia_msm8998-common.git vendor/nubia/msm8998-common || true

    - name: Prepare for build
      run: |
        cd rom
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(which ccache)
        export USE_CCACHE=1
        export BUILD_NUMBER=${{ github.run_number }}
        source build/envsetup.sh
        breakfast nx563j 2>&1 | tail -50
        
    - name: Start build
      run: |
        cd rom
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        brunch nx563j -j4 2>&1 | tee build.log
        
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: rom-build
        path: rom/out/target/product/nx563j/*.zip
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-log
        path: rom/build.log
        retention-days: 7
