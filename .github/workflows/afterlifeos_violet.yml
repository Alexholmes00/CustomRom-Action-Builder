name: Build OS for nx563j

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OS for nx563j
    runs-on: ubuntu-latest

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-11-jdk bc bison build-essential curl flex git gnupg gperf \
          libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush repo rsync \
          schedtool squashfs-tools xsltproc zip unzip zlib1g-dev ccache git-lfs neofetch

    - name: Set Git config and add repo tool
      run: |
        neofetch
        git config --global user.name "aa"
        git config --global user.email "aa@gmail.com"
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize AfterlifeOS repo
      run: |
        mkdir rom && cd rom
        repo init -u https://github.com/Evolution-X/manifest -b cnb --git-lfs
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone device tree, vendor, kernel
      run: |
        cd rom
        git clone https://github.com/LineageOS/android_device_nubia_msm8998-common.git device/nubia/msm8998-common
        git clone https://github.com/LineageOS/android_device_nubia_nx563j.git device/nubia/nx563j
        git clone https://github.com/LineageOS/android_kernel_nubia_msm8998.git kernel/nubia/msm8998
        git clone https://github.com/TheMuppets/proprietary_vendor_nubia_nx563j.git vendor/nubia/nx563j
        git clone https://github.com/TheMuppets/proprietary_vendor_nubia_msm8998-common.git vendor/nubia/msm8998-common

    - name: Prepare for build
      run: |
        cd rom
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(which ccache)
        export USE_CCACHE=1
        ccache -M 50G
        source build/envsetup.sh
        lunch lineage_nx563j-cp2a-user

    - name: Start build
      run: |
        cd rom
        m evolution
